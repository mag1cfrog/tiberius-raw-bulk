name: Cache warmer

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-apt-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Build apt cache key
        id: cache-key
        run: |
          week="$(date +%G-%V)"
          image="${ImageOS:-ubuntu}-${ImageVersion:-unknown}"
          echo "cache-key=linux-apt-${image}-${week}-openssl-libkrb5-dev-v1" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        id: apt-cache
        uses: actions/cache@v5
        with:
          path: .cache/apt/archives
          key: ${{ steps.cache-key.outputs.cache-key }}

      - name: Download apt packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/apt/archives/partial
          sudo apt-get update
          sudo apt-get install -y --download-only \
            -o Dir::Cache::archives="$PWD/.cache/apt/archives" \
            openssl libkrb5-dev
          sudo chown -R "$USER:$USER" .cache/apt
          rm -rf .cache/apt/archives/partial

  windows-openssl-cache:
    runs-on: windows-latest

    steps:
      - name: Setup OpenSSL installer cache
        id: opensslcache
        uses: actions/cache@v5
        with:
          path: C:\Users\runneradmin\AppData\Local\Temp\openssl-installer\
          key: win64-openssl-3.5.7-installer

      - name: Setup OpenSSL install cache
        id: opensslinstallcache
        uses: actions/cache@v5
        with:
          path: C:\Users\runneradmin\AppData\Local\OpenSSL-Win64-3.5.7\
          key: win64-openssl-3.5.7-install-v1

      - name: Install OpenSSL
        shell: powershell
        run: |
          $installerDir = "C:\Users\runneradmin\AppData\Local\Temp\openssl-installer"
          $installer = Join-Path $installerDir "Win64OpenSSL-3_5_7.exe"
          $installerUrl = "https://slproweb.com/download/Win64OpenSSL-3_5_7.exe"
          $opensslDir = "C:\Users\runneradmin\AppData\Local\OpenSSL-Win64-3.5.7"

          $includeDir = Join-Path $opensslDir "include"
          $libDir = @(
            (Join-Path $opensslDir "lib\VC\x64\MD"),
            (Join-Path $opensslDir "lib\VC\x64\MT"),
            (Join-Path $opensslDir "lib"),
            (Join-Path $opensslDir "lib64")
          ) | Where-Object {
            Test-Path (Join-Path $_ "libssl.lib")
          } | Select-Object -First 1

          if (-not ((Test-Path $includeDir) -and $libDir)) {
            New-Item -ItemType Directory -Force -Path $installerDir | Out-Null

            if (-not (Test-Path $installer)) {
              for ($attempt = 1; $attempt -le 3; $attempt++) {
                try {
                  Invoke-WebRequest -Uri $installerUrl -OutFile $installer -UseBasicParsing
                  break
                } catch {
                  if ($attempt -eq 3) {
                    throw
                  }
                  Start-Sleep -Seconds ($attempt * 20)
                }
              }
            }

            $process = Start-Process -FilePath $installer -ArgumentList @(
              "/silent",
              "/sp-",
              "/suppressmsgboxes",
              "/norestart",
              "/dir=$opensslDir"
            ) -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "OpenSSL installer failed with exit code $($process.ExitCode)"
            }
          }

          if (-not (Test-Path $opensslDir)) {
            throw "OpenSSL install directory was not found"
          }

          $includeDir = Join-Path $opensslDir "include"
          $libDir = @(
            (Join-Path $opensslDir "lib\VC\x64\MD"),
            (Join-Path $opensslDir "lib\VC\x64\MT"),
            (Join-Path $opensslDir "lib"),
            (Join-Path $opensslDir "lib64")
          ) | Where-Object {
            Test-Path (Join-Path $_ "libssl.lib")
          } | Select-Object -First 1

          if (-not $libDir) {
            throw "OpenSSL libssl.lib was not found"
          }
