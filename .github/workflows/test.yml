name: Cargo tests
on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  linux-apt-cache:
    runs-on: ubuntu-latest

    outputs:
      cache-key: ${{ steps.cache-key.outputs.cache-key }}

    steps:
      - name: Build apt cache key
        id: cache-key
        run: |
          week="$(date +%G-%V)"
          image="${ImageOS:-ubuntu}-${ImageVersion:-unknown}"
          echo "cache-key=linux-apt-${image}-${week}-openssl-libkrb5-dev-v1" >> "$GITHUB_OUTPUT"

      - name: Cache apt packages
        id: apt-cache
        uses: actions/cache@v5
        with:
          path: .cache/apt/archives
          key: ${{ steps.cache-key.outputs.cache-key }}

      - name: Download apt packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/apt/archives/partial
          sudo apt-get update
          sudo apt-get install -y --download-only \
            -o Dir::Cache::archives="$PWD/.cache/apt/archives" \
            openssl libkrb5-dev
          sudo chown -R "$USER:$USER" .cache/apt
          rm -rf .cache/apt/archives/partial

  clippy:
    runs-on: ubuntu-latest
    needs: linux-apt-cache
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch dependencies
        run: |
          for attempt in 1 2 3; do
            if cargo fetch; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1
      - name: Restore apt package cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/apt/archives
          key: ${{ needs.linux-apt-cache.outputs.cache-key }}
      - name: Install dependencies
        run: |
          if compgen -G ".cache/apt/archives/*.deb" > /dev/null; then
            sudo dpkg -i .cache/apt/archives/*.deb || {
              sudo apt-get update
              sudo apt-get install -y -f
              sudo apt-get install -y openssl libkrb5-dev
            }
          else
            sudo apt-get update
            sudo apt-get install -y openssl libkrb5-dev
          fi
      - name: Run clippy
        run: cargo clippy --features=all

  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  cargo-check-aad-example:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch dependencies
        run: |
          for attempt in 1 2 3; do
            if cargo fetch; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1

      - name: Check AAD auth example
        run: cargo check --example aad-auth --features=aad-auth-example

  cargo-test-linux:
    name: cargo-test-linux (${{ matrix.database }}, ${{ matrix.features.flags }})
    runs-on: ubuntu-latest
    needs: linux-apt-cache

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        database:
          - 2017
          - 2019
          - 2022
          - azure-sql-edge
        features:
          - flags: "--features=all"
            cache-key: all
          - flags: "--no-default-features"
            cache-key: no-default-features
          - flags: "--no-default-features --features=chrono"
            cache-key: chrono
          - flags: "--no-default-features --features=time"
            cache-key: time
          - flags: "--no-default-features --features=rustls"
            cache-key: rustls
          - flags: "--no-default-features --features=vendored-openssl"
            cache-key: vendored-openssl

    env:
      TIBERIUS_TEST_CONNECTION_STRING: "server=tcp:localhost,1433;user=SA;password=<YourStrong@Passw0rd>;TrustServerCertificate=true"
      RUSTFLAGS: "-Dwarnings"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cargo-test-linux-${{ matrix.features.cache-key }}

      - name: Fetch dependencies
        run: |
          for attempt in 1 2 3; do
            if cargo fetch; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1

      - name: Restore apt package cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/apt/archives
          key: ${{ needs.linux-apt-cache.outputs.cache-key }}

      - name: Install dependencies
        run: |
          if compgen -G ".cache/apt/archives/*.deb" > /dev/null; then
            sudo dpkg -i .cache/apt/archives/*.deb || {
              sudo apt-get update
              sudo apt-get install -y -f
              sudo apt-get install -y openssl libkrb5-dev
            }
          else
            sudo apt-get update
            sudo apt-get install -y openssl libkrb5-dev
          fi

      - name: Build tests
        run: cargo test --no-run ${{ matrix.features.flags }}

      - name: Start SQL Server ${{matrix.database}}
        run: |
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.yml up -d mssql-${{matrix.database}}; then
              exit 0
            fi
            sleep $((attempt * 30))
          done
          exit 1

      - name: Wait for SQL Server ${{matrix.database}}
        run: |
          for attempt in $(seq 1 60); do
            if docker compose -f docker-compose.yml exec -T mssql-${{matrix.database}} bash -lc '
              for sqlcmd in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do
                if [ -x "$sqlcmd" ]; then
                  trust_arg=""
                  if "$sqlcmd" "-?" 2>&1 | grep -q -- "-C"; then
                    trust_arg="-C"
                  fi
                  "$sqlcmd" -S localhost -U SA -P "<YourStrong@Passw0rd>" -Q "SELECT 1" $trust_arg -b -l 2 >/dev/null 2>&1 && exit 0
                  exit 1
                fi
              done
              exit 127
            '; then
              exit 0
            fi
            docker compose -f docker-compose.yml ps mssql-${{matrix.database}}
            sleep 5
          done
          docker compose -f docker-compose.yml logs mssql-${{matrix.database}}
          exit 1

      - name: Run tests
        run: cargo test ${{ matrix.features.flags }}

  cargo-test-windows:
    runs-on: windows-latest

    env:
      TIBERIUS_TEST_INSTANCE: "MSSQLSERVER"
      TIBERIUS_TEST_CONNECTION_STRING: "server=tcp:127.0.0.1,1433;IntegratedSecurity=true;TrustServerCertificate=true"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Set required PowerShell modules
        id: psmodulecache
        uses: potatoqualitee/psmodulecache@v1
        with:
          modules-to-cache: SqlServer

      - name: Setup PowerShell module cache
        id: cacher
        uses: actions/cache@v5
        with:
            path: ${{ steps.psmodulecache.outputs.modulepath }}
            key: ${{ steps.psmodulecache.outputs.keygen }}

      - name: Setup Chocolatey download cache
        id: chococache
        uses: actions/cache@v5
        with:
          path: C:\Users\runneradmin\AppData\Local\Temp\chocolatey\
          key: chocolatey-install

      - name: Fetch dependencies
        shell: powershell
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            cargo fetch
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            Start-Sleep -Seconds ($attempt * 20)
          }
          exit 1

      - name: Install OpenSSL
        shell: powershell
        run: |
          choco install openssl --version=3.6.2 --no-progress -y
          $opensslDir = "C:\Program Files\OpenSSL-Win64"
          if (-not (Test-Path $opensslDir)) {
            $opensslDir = "C:\Program Files\OpenSSL"
          }
          if (-not (Test-Path $opensslDir)) {
            throw "OpenSSL install directory was not found"
          }

          $includeDir = Join-Path $opensslDir "include"
          $libDir = @(
            (Join-Path $opensslDir "lib\VC\x64\MD"),
            (Join-Path $opensslDir "lib\VC\x64\MT"),
            (Join-Path $opensslDir "lib"),
            (Join-Path $opensslDir "lib64")
          ) | Where-Object {
            Test-Path (Join-Path $_ "libssl.lib")
          } | Select-Object -First 1

          if (-not $libDir) {
            throw "OpenSSL libssl.lib was not found"
          }

          "OPENSSL_DIR=$opensslDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_INCLUDE_DIR=$includeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIB_DIR=$libDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $opensslDir "bin") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build tests
        shell: powershell
        run: |
          $featureSets = @(
            @("--features=all"),
            @("--no-default-features", "--features=rustls,winauth"),
            @("--no-default-features", "--features=openssl,winauth")
          )

          foreach ($features in $featureSets) {
            Write-Host "cargo test --no-run $($features -join ' ')"
            & cargo test --no-run @features
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Install required PowerShell modules
        if: steps.cacher.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                if (-not (Get-Module -ListAvailable -Name SqlServer)) {
                  if (Get-Command Install-PSResource -ErrorAction SilentlyContinue) {
                    if (-not (Get-PSResourceRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                      Register-PSResourceRepository -PSGallery -ErrorAction Stop
                    }
                    Set-PSResourceRepository -Name PSGallery -Trusted -ErrorAction Stop
                    Install-PSResource SqlServer -Scope CurrentUser -TrustRepository -Reinstall -ErrorAction Stop
                  } else {
                    if (-not (Get-PackageProvider -Name NuGet -ErrorAction SilentlyContinue)) {
                      Install-PackageProvider -Name NuGet -Scope CurrentUser -Force -ErrorAction Stop
                    }
                    if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                      Register-PSRepository -Default -ErrorAction Stop
                    }
                    Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
                    Install-Module SqlServer -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop
                  }
                }
                exit 0
              } catch {
                if ($attempt -eq 3) {
                  throw
                }
                Start-Sleep -Seconds ($attempt * 20)
              }
            }

      - name: Install SQL Server 2019
        shell: powershell
        run: |
          choco feature disable --name="'exitOnRebootDetected'"
          $ErrorActionPreference = 'SilentlyContinue'
          choco install sql-server-2019 --params="'/IgnorePendingReboot'"

      - name: Setup SQL Server 2019
        shell: powershell
        run: |
          Import-Module 'sqlps'

          [reflection.assembly]::LoadWithPartialName("Microsoft.SqlServer.Smo") | Out-Null
          [reflection.assembly]::LoadWithPartialName("Microsoft.SqlServer.SqlWmiManagement") | Out-Null

          $serverName = $env:COMPUTERNAME
          $instanceName = "MSSQLSERVER"

          $smo = 'Microsoft.SqlServer.Management.Smo.'
          $wmi = new-object ($smo + 'Wmi.ManagedComputer')
          $wmi

          # Enable TCP/IP
          echo "Enabling TCP/IP"
          $Tcp = $wmi.GetSmoObject("ManagedComputer[@Name='$serverName']/ServerInstance[@Name='$instanceName']/ServerProtocol[@Name='Tcp']")
          $Tcp.IsEnabled = $true
          $Tcp.alter()
          $Tcp

          # Enable named pipes
          echo "Enabling named pipes"
          $Np = $wmi.GetSmoObject("ManagedComputer[@Name='$serverName']/ServerInstance[@Name='$instanceName']/ServerProtocol[@Name='Np']")
          $Np.IsEnabled = $true
          $Np.Alter()
          $Np

          # Set Alias
          echo "Setting the alias"
          New-Item HKLM:\SOFTWARE\Microsoft\MSSQLServer\Client -Name ConnectTo | Out-Null
          Set-ItemProperty -Path HKLM:\SOFTWARE\Microsoft\MSSQLServer\Client\ConnectTo -Name '(local)' -Value "DBMSSOCN,$serverName\$instanceName" | Out-Null

          # Start services
          echo "Starting services"
          Set-Service SQLBrowser -StartupType Manual
          Start-Service SQLBrowser
          net stop MSSQLSERVER
          net start MSSQLSERVER

      - name: Run normal tests
        shell: powershell
        run: |
          $featureSets = @(
            @("--features=all"),
            @("--no-default-features", "--features=rustls,winauth"),
            @("--no-default-features", "--features=openssl,winauth")
          )

          foreach ($features in $featureSets) {
            Write-Host "cargo test $($features -join ' ')"
            & cargo test @features
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

  cargo-test-macos:
    runs-on: macos-15-intel

    strategy:
      fail-fast: false
      matrix:
        include:
          - features: "--no-default-features --features=rustls,chrono,time,tds73,sql-browser-async-std,sql-browser-tokio,sql-browser-smol,integrated-auth-gssapi,rust_decimal,bigdecimal"
            test-target: "--lib"
          - features: "--no-default-features --features=vendored-openssl"
            test-target: "--lib"

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch dependencies
        run: |
          for attempt in 1 2 3; do
            if cargo fetch; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1

      - name: Run tests
        run: cargo test ${{matrix.features}} ${{matrix.test-target}}
