name: Dependency policy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  cargo-deny:
    name: cargo-deny advisories, bans, and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.7

      - name: Fetch dependencies
        run: |
          for attempt in 1 2 3; do
            if cargo fetch; then
              exit 0
            fi
            sleep $((attempt * 20))
          done
          exit 1

      - name: Check dependency policy
        run: cargo deny check advisories bans sources

      - name: Policy note
        run: |
          echo "deny.toml currently treats duplicate versions and wildcard dependencies as warnings."
          echo "Advisories and unknown package sources are enforced by this workflow."
