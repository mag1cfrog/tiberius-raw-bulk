[graph]
all-features = false
no-default-features = false

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0052", reason = "async-std support is kept temporarily for compatibility; track deprecation or replacement separately." },
    { id = "RUSTSEC-2024-0375", reason = "atty is dev-only through names and env_logger; remove names and upgrade env_logger in focused cleanup." },
    { id = "RUSTSEC-2024-0384", reason = "instant is currently dev-only through the old Azure example stack in this deny graph; update or isolate that stack separately." },
    { id = "RUSTSEC-2025-0119", reason = "number_prefix is dev-only through indicatif in examples/bulk.rs; update or remove indicatif separately." },
    { id = "RUSTSEC-2024-0436", reason = "paste is used directly in tests and transitively through the old Azure example stack; replace or update separately." },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is dev-only through names -> clap 3; replace names separately." },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is in the optional rustls stack and old dev reqwest path; migrate rustls/dev HTTP stack separately." },
    { id = "RUSTSEC-2026-0098", reason = "rustls-webpki is in the optional rustls stack and old dev reqwest path; migrate rustls/dev HTTP stack separately." },
    { id = "RUSTSEC-2026-0099", reason = "rustls-webpki is in the optional rustls stack and old dev reqwest path; migrate rustls/dev HTTP stack separately." },
    { id = "RUSTSEC-2026-0104", reason = "rustls-webpki is in the optional rustls stack and old dev reqwest path; migrate rustls/dev HTTP stack separately." },
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
